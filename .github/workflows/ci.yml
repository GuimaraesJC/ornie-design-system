name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tokens in sync (tokens.json is the only source of truth)
        run: |
          pnpm tokens
          git diff --exit-code src/styles/tokens.css tokens/

      - name: Build
        run: pnpm build

      - name: Token audit (no hex, no raw scales, no theme selectors)
        run: pnpm audit:tokens

      - name: Contrast audit (WCAG AA, both themes)
        run: pnpm audit:contrast

      - name: Install chromium for axe
        run: pnpm exec playwright install --with-deps chromium

      - name: A11y audit (axe over variant grids)
        run: pnpm audit:a11y
