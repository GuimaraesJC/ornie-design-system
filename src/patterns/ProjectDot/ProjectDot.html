<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectDot</title>
  <link rel="stylesheet" href="../../../dist/styles.css" />
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <script src="../../../dist/grid/ornie-grid.js"></script>
  <script>
    OrnieGrid.mount(function (h, C, g) {
      var colors = ['river', 'moss', 'clay', 'fur', 'rust'];
      return [
        g.section(
          'colors × label',
          g.row.apply(null, ['dots'].concat(colors.map(function (c) { return h(C.ProjectDot, { color: c, key: c }); }))),
          h(
            'div',
            { style: { display: 'flex', flexDirection: 'column', gap: '8px', fontSize: '13px', color: 'var(--ornie-text-muted)' } },
            colors.map(function (c) {
              return h(C.ProjectDot, { color: c, key: c, label: c + ' project' });
            }),
          ),
        ),
        g.section(
          'in context',
          g.row(
            'inside MetaLine (11.5px)',
            h(
              'div',
              { style: { background: 'var(--ornie-surface)', borderRadius: 'var(--ornie-radius-sm)', padding: '8px 12px' } },
              h(C.MetaLine, null, h('span', null, '9:00'), h(C.ProjectDot, { color: 'moss', label: 'Garden project' })),
            ),
          ),
          g.row(
            'truncating label at 140px',
            h('div', { style: { width: '140px', fontSize: '13px', color: 'var(--ornie-text-muted)' } }, h(C.ProjectDot, { color: 'clay', label: 'A very long project name' })),
          ),
        ),
      ];
    });
  </script>
</body>
</html>
