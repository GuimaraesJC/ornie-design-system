<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spinner</title>
  <link rel="stylesheet" href="../../../dist/styles.css" />
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <script src="../../../dist/grid/ornie-grid.js"></script>
  <script>
    OrnieGrid.mount(function (h, C, g) {
      var mutedText = function (text) {
        return h(
          'span',
          {
            style: {
              fontFamily: 'var(--ornie-font-sans)',
              fontSize: 'var(--ornie-text-sm)',
              color: 'var(--ornie-text-muted)',
            },
          },
          text,
        );
      };
      return [
        g.section(
          'sizes (default ink --ornie-text-subtle)',
          g.row('14 — inline', h(C.Spinner, { size: 14 })),
          g.row('18 — default', h(C.Spinner, {})),
          g.row('24 — panel', h(C.Spinner, { size: 24 })),
        ),
        g.section(
          'inherited ink (currentColor)',
          g.row(
            'muted parent',
            h(
              'span',
              { style: { display: 'inline-flex', color: 'var(--ornie-text-muted)' } },
              h(C.Spinner, { size: 18, label: 'Loading' }),
            ),
          ),
          g.row(
            'accent parent',
            h(
              'span',
              { style: { display: 'inline-flex', color: 'var(--ornie-accent-text)' } },
              h(C.Spinner, { size: 18, label: 'Loading' }),
            ),
          ),
        ),
        g.section(
          'in context',
          g.row(
            'TopBar sync pending',
            h(
              'span',
              { style: { display: 'inline-flex', alignItems: 'center', gap: '8px' } },
              h(C.Spinner, { size: 14, label: 'Sync in progress' }),
              mutedText('Syncing'),
            ),
          ),
        ),
      ];
      // Reduced motion: the ring pauses (--ornie-spin-state) — it must never
      // speed up. Spinner is inert; nothing to tab to.
    });
  </script>
</body>
</html>
