<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select</title>
  <link rel="stylesheet" href="../../../dist/styles.css" />
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <script src="../../../dist/grid/ornie-grid.js"></script>
  <script>
    OrnieGrid.mount(function (h, C, g) {
      var box = function (node) {
        return h('div', { style: { width: '250px' } }, node);
      };
      var projects = [
        { value: 'garden', label: 'Garden project' },
        { value: 'kitchen', label: 'Kitchen reno' },
        { value: 'none', label: 'No project' },
      ];
      var matrix = function (size) {
        return g.section(
          'size ' + size,
          g.row(
            'rest',
            box(h(C.Select, { size: size, label: 'Project', options: projects, defaultValue: 'garden' })),
            box(h(C.Select, { size: size, label: 'Repeat', options: projects, placeholder: 'Never' })),
          ),
          g.row(
            'leading',
            box(
              h(C.Select, {
                size: size,
                label: 'Project',
                leading: h(C.Icon, { name: 'folder' }),
                options: projects,
                defaultValue: 'garden',
              }),
            ),
            box(
              h(C.Select, {
                size: size,
                label: 'Project',
                leading: h(C.Icon, { name: 'folder' }),
                options: projects,
                placeholder: 'No project yet',
              }),
            ),
          ),
          g.row(
            'error',
            box(
              h(C.Select, {
                size: size,
                label: 'Project',
                options: projects,
                placeholder: 'Choose a project',
                error: 'Please choose a project to continue.',
              }),
            ),
            box(
              h(C.Select, {
                size: size,
                label: 'Project',
                leading: h(C.Icon, { name: 'folder' }),
                options: projects,
                defaultValue: 'garden',
                error: 'That project was archived.',
              }),
            ),
          ),
          g.row(
            'disabled',
            box(h(C.Select, { size: size, label: 'Project', options: projects, defaultValue: 'garden', disabled: true })),
            box(
              h(C.Select, {
                size: size,
                label: 'Project',
                leading: h(C.Icon, { name: 'folder' }),
                options: projects,
                defaultValue: 'kitchen',
                disabled: true,
              }),
            ),
          ),
          g.row(
            'hint',
            box(h(C.Select, { size: size, label: 'Week starts on', options: projects, defaultValue: 'garden', hint: 'You can change this any time.' })),
          ),
        );
      };
      return [matrix('sm'), matrix('md'), matrix('lg')];
      // focus: tab to any select — the standard 2px --ornie-focus-ring outline
      // with accent border; error fields keep the danger border under the same
      // ring. The options popup itself is the OS's (native <select>).
    });
  </script>
</body>
</html>
